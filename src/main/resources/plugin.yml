name: NickBypass
version: '1.1'
main: dev.nickbypass.NickBypass
api-version: '1.19'
description: Allows staff to bypass nicknames and see real usernames in chat.
authors: []
depend:
  - Essentials

commands:
  nickbypass:
    description: Toggle seeing real usernames instead of nicknames in chat.
    usage: /nickbypass
    permission: nickbypass.toggle

permissions:
  nickbypass.toggle:
    description: Allows a player to toggle nickname bypass.
    default: op
  nickbypass.auto:
    description: Automatically bypasses nicknames without needing to toggle.
    default: false